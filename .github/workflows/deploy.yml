name: Deploy Projects to GitHub Pages

on:
  # push:
  #   branches:
  #     - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------
      # Checkout main
      # -----------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # -----------------------------------------------
      # Setup Node
      # -----------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # -----------------------------------------------
      # Create temporary deployment directory
      # -----------------------------------------------
      - name: Create deployment directory
        run: |
          rm -rf _site
          mkdir _site

      # -----------------------------------------------
      # Process every project folder
      # -----------------------------------------------
      - name: Build projects
        shell: bash
        run: |
          set -e

          for project in */; do

            project="${project%/}"

            # Ignore hidden directories
            if [[ "$project" == .* ]]; then
              continue
            fi

            echo ""
            echo "======================================"
            echo "Processing: $project"
            echo "======================================"

            # -------------------------------------------
            # React / Vite project
            # -------------------------------------------
            if [[ -f "$project/package.json" ]]; then

              echo "Vite/React project detected."

              cd "$project"

              if [[ -f package-lock.json ]]; then
                npm ci
              else
                npm install
              fi

              # Repository + project path
              export BASE_PATH="/${GITHUB_REPOSITORY#*/}/$project/"

              echo "BASE_PATH=$BASE_PATH"

              npm run build

              cd ..

              if [[ ! -d "$project/dist" ]]; then
                echo "ERROR: $project/dist was not created."
                exit 1
              fi

              mkdir -p "_site/$project"

              cp -R "$project/dist/." "_site/$project/"

            # -------------------------------------------
            # Plain HTML/CSS/JS project
            # -------------------------------------------
            elif [[ -f "$project/index.html" ]]; then

              echo "HTML/CSS/JS project detected."

              mkdir -p "_site/$project"

              cp -R "$project/." "_site/$project/"

            else

              echo "Skipping $project"
              echo "No package.json or index.html found."

            fi

          done

      # -----------------------------------------------
      # Generate automatic project homepage
      # -----------------------------------------------
      - name: Generate project index
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import html

          site = Path("_site")

          # Remove the existing generated index.html

          index_file = site / "index.html"

          if index_file.exists():
              index_file.unlink()

          projects = sorted(
              [
                  directory
                  for directory in site.iterdir()
                  if directory.is_dir()
                  and (directory / "index.html").exists()
              ],
              key=lambda path: path.name.lower()
          )

          cards = []

          for project in projects:

              name = project.name

              if "-" in name:
                  number, title = name.split("-", 1)
              else:
                  number = ""
                  title = name

              title = title.replace("-", " ").title()

              cards.append(f"""
              <a href="./{html.escape(name)}/">
                  <p>{html.escape(name)}</p>
              </a>
              """)

          cards_html = "\n".join(cards)

          if not cards_html:
              cards_html = """
              <p>
                No projects found.
              </p>
              """

          page = f"""
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >
            <title>Frontend Projects | DevHansa</title>
          </head>
          <body>

            <main>
                <h1>
                  Frontend Projects | DevHansa
                </h1>
             
              <section class="projects">
                {cards_html}
              </section>

            </main>

          </body>
          </html>
          """

          index_file.write_text(
              page,
              encoding="utf-8"
          )

          print(
              f"Generated index with {len(projects)} projects."
          )
          PY

      # -----------------------------------------------
      # Publish _site to docs branch
      # -----------------------------------------------
      - name: Deploy to docs branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: docs
          publish_dir: ./_site
          force_orphan: true
